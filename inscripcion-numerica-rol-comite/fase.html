<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Fase de inscripción numérica, rol comité</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Siempre claro: sin tema oscuro para que no haya parpadeo en la primera carga. */
:root{--panel:#ffffff;--fg:#1f2330;--muted:#5d6272;--line:#dcdbd5;--accent:#d74009;--font:'Inter',-apple-system,system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:#fff;color:var(--fg);font-family:var(--font);margin:0;line-height:1.5}
.board{display:none}
.board.cur{display:block}
.board>.app{min-height:100vh}

/* ---------- Artboard: la app, siempre clara ---------- */
.app{
  --n-050:#fff3e6;--n-100:#ffedc7;--n-500:#ff7b24;--n-600:#f05705;--n-700:#d74009;--n-900:#942700;
  --g-050:#fafbff;--g-100:#f4f5f9;--g-200:#e8e9f2;--g-300:#d4d5e4;--g-500:#9c9ebf;--g-600:#8788ab;--g-700:#646587;--g-900:#282834;
  --ok-100:#defade;--ok-700:#1f8923;--info-100:#cef4ff;--info-700:#0a55a8;--warn-100:#fef3c7;--warn-700:#b45309;--err-100:#ffe5e9;--err-700:#da1630;
  background:#fff;color:var(--g-900);font-family:'Inter',-apple-system,sans-serif;font-size:14px;position:relative;color-scheme:light
}
.app *{font-family:inherit}
.page{padding:28px 20px 36px;display:flex;flex-direction:column;gap:18px}
.hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;flex-wrap:wrap}
.hdr h1{font-size:28px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em}
.hdr p{margin:0;color:var(--g-700);font-size:15px}
.seg{display:flex;gap:4px;padding:5px;border:1px solid var(--g-200);border-radius:99px;background:#fff}
.seg button{border:2px solid transparent;background:none;border-radius:99px;padding:8px 18px;font-size:14px;font-weight:500;color:var(--g-700);cursor:pointer}
.seg button.on{border-color:var(--n-700);color:var(--g-900)}
.seg-fill{flex:1 1 auto}.seg-fill button{flex:1 1 0;text-align:center}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ph{display:flex;flex-direction:column;gap:4px}
.ph-card{display:flex;align-items:center;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;background:#fff;border:1px solid var(--g-200);border-radius:12px;padding:16px 20px;box-shadow:0 1px 2px rgba(145,158,171,.16)}
.ph-card h1{margin:0;font-size:20px;line-height:1.3;font-weight:700;letter-spacing:-.01em}
.ph-ctx{margin:0 0 4px;font-size:13px;color:var(--g-700)}
.ph-lead{margin:14px 0 0;color:var(--g-700);font-size:15px}
.back{align-self:flex-start;display:inline-flex;align-items:center;min-height:44px;color:var(--n-700);font-weight:600;font-size:14px;text-decoration:none}
.back:hover{text-decoration:underline}
.hdr-a{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
/* Con pestañas, la card queda solo con el título; pestañas y texto van sueltos debajo. */
.ph-air{padding:0;margin-top:-10px}
.ptabs{display:flex;gap:4px;border-bottom:1px solid var(--g-200);overflow-x:auto;scrollbar-width:thin}
.ptab{flex:none;min-height:44px;border:0;background:none;padding:10px 16px;font-size:14px;font-weight:600;color:var(--g-700);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.ptab:focus-visible,.back:focus-visible{outline:2px solid var(--n-700);outline-offset:-2px;border-radius:6px}
@media (max-width:640px){.hdr{flex-direction:column;gap:12px}.hdr h1{font-size:22px;line-height:1.25}.hdr-a{width:100%}.ptab{padding:10px 14px}}
.ptab:hover{color:var(--g-900)}.ptab.on{color:var(--n-700);border-bottom-color:var(--n-700);cursor:default}
.pgn-b{justify-content:center;padding-top:16px}
.toolbar .sp{flex:1}
.sel{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--g-300);border-radius:99px;height:40px;padding:0 14px;font-size:13px;color:var(--g-700);background:#fff}
.sel select{border:0;background:none;font-size:13px;color:var(--g-900);outline:0;max-width:240px}
.btn{border-radius:99px;height:44px;padding:0 22px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;white-space:nowrap}
.btn.pri{background:var(--n-700);color:#fff}
.btn.sec{background:#fff;color:var(--n-700);border-color:var(--g-300)}
.btn.sm{height:34px;font-size:13px;padding:0 14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.tbl{width:100%;border-collapse:separate;border-spacing:0}
.tbl th{background:var(--g-100);text-align:left;font-weight:600;color:var(--g-700);font-size:13px;padding:12px 10px;white-space:nowrap}
.tbl th.c,.tbl td.c{text-align:center}
.tbl th.grp{text-align:center;border-bottom:1px solid var(--g-300)}
.tbl td{padding:12px 10px;border-bottom:1px solid var(--g-200);font-size:14px;vertical-align:middle}
.tbl td.sub{color:var(--g-700)}
.mini-n{display:block;font-size:11px;color:var(--g-700);font-weight:400}
.tbl .vsep{border-left:1px solid var(--g-300)}
.badge{display:inline-block;font-size:12px;font-weight:600;border-radius:99px;padding:3px 10px;background:var(--g-100);color:var(--g-700)}
.badge.info{background:var(--info-100);color:var(--info-700)}
.badge.ok{background:var(--ok-100);color:var(--ok-700)}
.badge.warn{background:var(--warn-100);color:var(--warn-700)}
.badge.err{background:var(--err-100);color:var(--err-700)}
.ex{display:inline-block;font-size:11px;font-weight:600;color:var(--warn-700);background:var(--warn-100);border-radius:6px;padding:2px 8px;margin-left:8px;vertical-align:middle}
.mini{display:block;height:5px;border-radius:3px;background:var(--g-200);margin-top:5px;min-width:70px}
.mini i{display:block;height:100%;border-radius:3px}
.mini i.ok{background:#28bf2d}.mini i.warn{background:#e08a14}.mini i.err{background:var(--err-700)}
.lg{display:flex;gap:16px;font-size:12px;color:var(--g-700);flex-wrap:wrap}
.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.kpi{display:flex;align-items:center;gap:20px;background:var(--g-100);border-radius:16px;padding:18px 22px;flex-wrap:wrap}
.kpi b{font-size:30px}
.lg-n{gap:28px}.lg-n span{display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.2}.lg-n b{font-size:24px;color:var(--g-900)}
.kpi .mini{flex:1;min-width:220px;height:10px}
.chipf{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--g-300);border-radius:99px;padding:3px 10px;font-size:12px;background:#fff}
.chipf b{font-weight:600}
.menuwrap{position:relative;display:inline-block}
.menu{position:absolute;right:0;top:50px;width:380px;background:#fff;border:1px solid var(--g-200);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.16);padding:8px;z-index:5}
.menu .it{display:block;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:12px;cursor:pointer;font-size:14px}
.menu .it:hover{background:var(--g-100)}
.menu .it b{display:block;font-size:14px}
.menu .it small{display:block;color:var(--g-700);font-size:12.5px;margin:2px 0 6px}
.callout{border:1px solid #f2d27a;background:var(--warn-100);color:#6b3c06;border-radius:12px;padding:12px 16px;font-size:13px}
.xl{border:1px solid var(--g-300);border-radius:6px;overflow:auto}
.xl table{border-collapse:collapse;font-size:12.5px;min-width:1250px;width:100%}
.xl th{background:#e9f3ea;border:1px solid var(--g-300);padding:6px 10px;text-align:left;white-space:nowrap;font-weight:600}
.xl td{border:1px solid var(--g-200);padding:5px 10px;white-space:nowrap}
.xl td.r{text-align:right}
.xl .rn{background:var(--g-100);color:var(--g-700);text-align:center;width:34px}
.tab-x{display:flex;gap:2px;font-size:12px;margin-top:8px}.tab-x span{padding:4px 14px;border:1px solid var(--g-300);border-top:0;border-radius:0 0 6px 6px;background:#fff}.tab-x span.on{font-weight:700;background:var(--g-100,#f2f2f5)}
.pager-note{color:var(--g-700);font-size:12px}
.chk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--g-200);font-size:14.5px;cursor:pointer}
.chk input{width:18px;height:18px;margin-top:2px;accent-color:var(--n-700);flex:none}
.chk .hu{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--g-700);margin-left:6px}
.card{border:1px solid var(--g-200);border-radius:16px;padding:22px 24px}
.card h2{font-size:18px;margin:0 0 4px}
.card>p{margin:0 0 12px;color:var(--g-700);font-size:14px}
.mem{border:2px dashed var(--g-300);border-radius:14px;padding:22px;background:var(--g-050)}
.lk{color:var(--n-700);font-weight:600;font-size:14px;background:none;border:0;cursor:pointer;padding:0 4px}
.lk:hover{text-decoration:underline}
#pbar{position:fixed;bottom:72px;right:16px;z-index:30;font-size:13px;width:280px;max-width:calc(100vw - 32px);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 12px 32px rgba(0,0,0,.18);display:grid;gap:10px}
#pbar .sim-h{display:flex;align-items:center;justify-content:space-between;font-weight:600;color:var(--fg)}
#pbar button{font:inherit;font-size:13px;font-weight:500;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:99px;min-height:36px;padding:6px 14px;cursor:pointer;text-align:left}
#pbar .sim-x{width:36px;padding:0;text-align:center;font-size:18px;line-height:1}
#pbar button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ptoast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:40;background:#fff;color:#282834;border:1px solid #e8e9f2;border-left:5px solid #28bf2d;border-radius:12px;padding:12px 16px;box-shadow:0 10px 30px rgba(0,0,0,.14);font-size:14px;max-width:340px}
/* ---------- Consolidado real (C1), hoja (C5) y tablero (C6) ---------- */
.cq-h,.rw-h{display:grid;grid-template-columns:24px minmax(84px,1.15fr) minmax(84px,1fr) repeat(4,100px) 104px 150px 130px;align-items:center;column-gap:8px}
.rw-h.nc,.cq-h.nc{grid-template-columns:24px minmax(170px,1.15fr) minmax(170px,1fr) 220px 150px}
.cq-h{padding:0 38px;margin:6px -20px 0;color:var(--g-700);font-size:12px;font-weight:600}
/* Cabecera de columnas fija a todo el ancho; la fila abierta fija su título justo debajo. */
.cq-h{position:sticky;top:0;z-index:6;background:#fff;padding-block:8px}
.rw-h{margin-top:16px}
.rw.op>.rw-h{margin-top:0;padding-top:24px;position:sticky;top:var(--cqh,40px);z-index:5;background:#fff;border-bottom:1px solid var(--g-200)}
/* Ya pegadas, cada barra lleva detrás una banda fija del ancho del viewport. */
.cq-h.is-pin::before,.rw.op>.rw-h.is-pin::before{content:'';position:fixed;left:0;right:0;top:inherit;height:var(--ph,40px);z-index:-1;background:#fff}
.cq-h.is-pin::before{background:#e9eaf0}
.cq-h.is-pin:not(.has-sub)::before,.rw.op>.rw-h.is-pin::before{box-shadow:0 8px 12px -8px rgba(40,40,52,.28)}
@media(min-width:1160px){.sc>.scr:has(>.hsi),.sc>.scr:has(>.tbl){overflow:visible}}
.cq-h .sh{text-align:center;font-size:10.5px;white-space:nowrap}.cq-h .sh.m{color:var(--info-700)}.cq-h .sh.f{color:#a3185f}.cq-h .sh.j{color:var(--g-700);white-space:normal;line-height:1.2}
.cq.cj{font-size:13px;line-height:1.25;padding-inline:4px}
.rws{display:grid;gap:0;background:#fff}
.rw{border:0;border-bottom:1px solid var(--g-200);border-radius:0;background:#fff;overflow:clip}.rw:last-child{border-bottom:0}
.rw-h{width:100%;min-height:58px;padding:8px 18px;background:none;border:0;text-align:left;cursor:pointer;font-size:14px;color:var(--g-900)}
.rw-h:hover{background:var(--g-050)}
.rw-h:focus-visible{outline:2px solid var(--n-700);outline-offset:-2px}
.rw-h .md{text-align:center;color:var(--g-700)}
.rw-h .chv{display:inline-grid;transition:transform .15s;color:var(--g-700)}
.rw.op .chv{transform:rotate(180deg)}
.chs{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.chp{font-size:11px;font-weight:600;background:var(--g-100);color:var(--g-900);border-radius:99px;padding:3px 10px}
.cq{text-align:center;font-weight:600;font-size:15px}
.cq.nil{color:var(--g-500);font-weight:400}
.cq.sep{border-left:1px solid var(--g-300)}
.rw-b{background:#fafafa;border-top:1px solid var(--g-200);padding:12px 18px 14px 56px;font-size:13px}
.rw-b ul{margin:6px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:4px 24px}
.rw-b li{padding:3px 0;border-bottom:1px solid var(--g-200)}
.rw-b li.hit{font-weight:700;color:var(--n-700)}
.pgn{display:flex;align-items:center;gap:8px;color:var(--g-700);font-size:13px;flex-wrap:wrap}
.pgn input{border:1px solid var(--g-700);border-radius:8px;height:34px;width:56px;text-align:center;font:inherit;color:var(--g-900);background:#fff}
.pgn .ar{border:0;background:none;font-size:18px;color:var(--n-700);cursor:pointer;width:28px;height:30px}
.pgn .ar:disabled{color:var(--g-300);cursor:not-allowed}
.flt{font:inherit;font-size:13px;font-weight:600;cursor:pointer;border-color:var(--n-700);color:var(--n-700)}
.fpanel{position:absolute;left:0;top:46px;width:300px;background:#fff;border:1px solid var(--g-200);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.16);padding:14px;z-index:6;display:grid;gap:10px;font-size:13px}
.fpanel label{display:grid;gap:4px;color:var(--g-700);font-weight:600}
.fpanel select{border:1px solid var(--g-300);border-radius:10px;height:38px;padding:0 10px;font:inherit;color:var(--g-900);background:#fff}
.nores{padding:28px;text-align:center;color:var(--g-700);border:1px dashed var(--g-300);border-radius:14px}
.sheet{border:1px solid var(--g-300);border-radius:6px;overflow:hidden;background:#fff}
.mb{width:100%;aspect-ratio:1545/218;background:url(../shared/certificado-referencia.png) top / 100% auto no-repeat;background-color:#3a4258}
.sheet-t{text-align:center;padding:14px 16px 10px}
.sheet-t b{display:block;font-size:15px}
.sheet-t span{display:block;color:var(--g-700);font-size:12.5px}
.sheet .xl{border:0;border-top:1px solid var(--g-300);border-radius:0}
.td-t{max-width:230px;overflow:hidden;text-overflow:ellipsis}
/* tablero, dibujado con HTML y SVG */
.dsh{background:#f7f8fc;border:1px solid var(--g-200);border-radius:16px;padding:22px;display:grid;gap:18px}
.dsh h2{margin:0;font-size:30px;font-weight:600;letter-spacing:-.01em}
.dsh .sb{margin:2px 0 0;font-weight:600;font-size:14px}
.dtop{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.dtop small{display:block;text-align:right;letter-spacing:.08em;font-size:10.5px;color:var(--g-700);font-weight:700}
.dfil{display:flex;gap:8px;align-items:center;flex-wrap:nowrap;background:#fff;border:1px solid var(--g-200);border-radius:14px;padding:14px 16px;position:relative}
.dfil .df{display:inline-flex;align-items:center;gap:8px;flex:0 1 auto;min-width:0;background:#fafbff;border:1px solid var(--g-200);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.di{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;flex:none}
.di svg,.ic svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.dfil .sp{flex:1}
/* Una sola línea: los selectores ceden ancho antes que partir la barra. */
.dfil .gm,.dfil .dlk,.dfil .dap{flex:none;white-space:nowrap}
@media(max-width:1280px){.dfil .df .di{display:none}.dfil .df{padding:8px 10px}}
.dfil .df select{font:inherit;font-weight:600;border:0;background:transparent;max-width:210px;min-width:0;width:100%;text-overflow:ellipsis;cursor:pointer;color:inherit}
.dfil .df select:focus-visible,.dlk:focus-visible,.dap:focus-visible{outline:2px solid #ff6a00;outline-offset:2px}
.dlk,.dap{cursor:pointer}
.dlk{color:var(--g-700);font-weight:700;font-size:13px;background:none;border:0}
.dap{background:#ff6a00;color:#fff;font-weight:700;font-size:13px;border:0;border-radius:10px;padding:10px 16px;box-shadow:0 6px 14px -6px rgba(255,106,0,.7)}
.gm{position:relative;display:inline-block}
.gm>button{font:inherit;display:inline-flex;align-items:center;gap:10px;background:#fff7f0;border:1px solid #ffb98a;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--g-900)}
.gmenu{position:absolute;top:calc(100% + 6px);left:0;width:330px;background:#fff;border:1px solid var(--g-200);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:8px;z-index:8}
.gmenu label{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:13.5px;cursor:pointer}
.gmenu label:hover{background:var(--g-100)}
.gmenu input{width:16px;height:16px;accent-color:#ff6a00}
.gmenu .gx{display:flex;gap:14px;padding:6px 10px 8px;border-bottom:1px solid var(--g-200);margin-bottom:4px}
.gmenu .gx button{background:none;border:0;color:var(--n-700);font-weight:700;font-size:12.5px;cursor:pointer;padding:0}
.dkp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.dkp.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.dk{background:#fff;border:1px solid var(--g-200);border-radius:16px;padding:20px 22px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.dk small{display:block;font-size:10.5px;letter-spacing:.06em;font-weight:700;color:var(--g-700);text-transform:uppercase}
.dk b{display:block;font-size:34px;font-weight:400;margin-top:4px}
.ic{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;flex:none}
.dc{background:#fff;border:1px solid var(--g-200);border-radius:16px;padding:22px 24px;position:relative}
.dc .dh{margin:0;font-size:16px;font-weight:700}
.dc .sbt{margin:2px 0 0;color:var(--g-700);font-size:13px}
.dc .vb{position:absolute;right:22px;top:20px;background:#ff6a00;color:#fff;border:0;border-radius:8px;font-size:12px;font-weight:700;padding:7px 12px}
.dcr{display:grid;gap:14px}
.dcr.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.dc svg{width:100%;height:auto;display:block}
.dcn{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tot{font-size:11px;font-weight:700;font-style:italic;color:var(--g-700);background:var(--g-100);border:1px solid var(--g-200);border-radius:99px;padding:5px 12px}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;font-weight:600;margin-top:10px}
.leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.gbar{display:grid;grid-template-columns:90px 1fr 80px;gap:10px;align-items:center;margin-top:16px;font-size:13px}
.gbar .tr{height:16px;background:var(--g-100);border-radius:8px;overflow:hidden}
.gbar .tr i{display:block;height:100%}
.dnote{border:1px solid #f2d27a;background:var(--warn-100);color:#6b3c06;border-radius:12px;padding:10px 14px;font-size:13px}
.mem .mb{border-radius:6px;margin:12px 0}
/* ---------- Cards, mismo patrón que el delegado (N1): fondo gris, tarjetas blancas ---------- */
.board>.app{background:#f5f6fa;-webkit-font-smoothing:antialiased;--cp:24px;--sh:0 0 2px rgba(145,158,171,.2),0 12px 24px -4px rgba(145,158,171,.12)}
.page{max-width:1200px;margin:0 auto;padding:28px 32px 48px;gap:24px}
.ph{background:#fff;border:1px solid #e7e9f3;border-radius:12px;box-shadow:var(--sh);padding:24px 32px}
.ph-card{border:0;box-shadow:none;padding:0;border-radius:0;background:none}
.ph-card h1{font-size:24px;letter-spacing:-.02em}
.ph-lead{margin:0;padding-top:14px}
.ini-card{background:#fff;border:1px solid #e7e9f3;border-radius:12px;box-shadow:var(--sh);padding:28px var(--cp) 24px;display:flex;flex-direction:column;gap:20px;min-width:0}
.ini-k{margin:0;font-size:18px;line-height:1.2;font-weight:600;color:#282834;letter-spacing:-.02em}
.cd-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px 20px;flex-wrap:wrap}
.th-rec,.td-rec{width:210px;min-width:210px}.btn-rec{width:190px;justify-content:center}
.cd-s{margin:6px 0 0;color:#646587;font-size:14px}
/* Título suelto sobre una card sin bordes (C2 y C3). */
.cd-out{margin-bottom:-12px}.ini-nb{border:0;box-shadow:none;padding:0;--cp:0px;background:transparent}
/* Encabezado de columnas como una card, alineada con las filas. */
.hsi{border:1px solid var(--g-300);border-radius:14px;background:#fff;overflow:clip}
.ini-nb .cq-h{background:#e9eaf0;border:0;border-bottom:1px solid var(--g-300);border-radius:0;padding-inline:18px;margin:0}
.ini-nb{gap:12px}
/* El paginador queda pegado a la card de arriba (misma card), con 24 px de espacio arriba. */
.ini-nb>.pgn-b.toolbar{margin-top:-12px;background:#fff;border:1px solid var(--g-300);border-top:0;border-radius:0 0 14px 14px;padding:24px 18px 20px}
.ini-nb .sc:has(+ .pgn-b) .hsi{border-radius:14px 14px 0 0}
.ini-nb .sc:has(+ .pgn-b) .tbl tbody tr:last-child td:first-child{border-bottom-left-radius:0}
.ini-nb .sc:has(+ .pgn-b) .tbl tbody tr:last-child td:last-child{border-bottom-right-radius:0}
/* La barra de filtros de C1 es una card; con encabezado de columnas debajo, ambas se unen en una sola. */
.ini-nb>.toolbar{background:#fff;border:1px solid var(--g-300);border-radius:14px;padding:14px 18px}
/* Tablas de C2 y C3: una sola card; encabezado en gris y filas con divisores, sin huecos. */
.ini-nb .tbl{border-spacing:0}
.ini-nb .tbl thead th{background:#e9eaf0;border-bottom:0;position:sticky;top:0;z-index:5}
.ini-nb .tbl thead tr:nth-child(2) th{top:var(--th1,44px)}
.ini-nb .tbl.is-pin thead tr:first-child th:first-child::before{content:'';position:fixed;left:0;right:0;top:0;height:var(--ph,52px);z-index:-1;background:#e9eaf0;box-shadow:0 8px 12px -8px rgba(40,40,52,.28)}
.ini-nb .tbl thead tr:first-child th{border-top:1px solid var(--g-300)}
.ini-nb .tbl thead tr:last-child th,.ini-nb .tbl thead th[rowspan],.ini-nb .tbl thead th.grp{border-bottom:1px solid var(--g-300)}
.ini-nb .tbl thead tr:first-child th:first-child{border-left:1px solid var(--g-300);border-top-left-radius:14px;padding-left:18px}
.ini-nb .tbl thead tr:first-child th:last-child{border-right:1px solid var(--g-300);border-top-right-radius:14px;padding-right:18px}
.ini-nb .tbl tbody td{background:#fff;border-bottom:1px solid var(--g-200);padding:20px 10px}
.ini-nb .tbl tbody tr:last-child td{border-bottom:1px solid var(--g-300)}
.ini-nb .tbl tbody td:first-child{border-left:1px solid var(--g-300);padding-left:18px}
.ini-nb .tbl tbody td:last-child{border-right:1px solid var(--g-300);padding-right:18px}
.ini-nb .tbl tbody tr:last-child td:first-child{border-bottom-left-radius:14px}.ini-nb .tbl tbody tr:last-child td:last-child{border-bottom-right-radius:14px}
.ini-dl{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:1px;background:#e7e9f3;border:1px solid #e7e9f3;border-radius:8px;overflow:hidden}
.ini-dl>div{background:#fff;padding:20px 24px;display:flex;flex-direction:column;gap:10px}
.ini-dl dt{font-size:13px;font-weight:600;color:#646587}
.ini-dl dd{margin:0;display:flex;flex-direction:column;gap:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:16px}
.kpi1{padding:0;gap:0;overflow:hidden}
.kpi1 .ini-dl{display:block;border:0;background:none;border-radius:0}.kpi1 .ini-dl>div{height:100%}
.ini-v{display:flex;align-items:baseline;gap:6px;font-size:15px;font-weight:600;color:#646587}
.ini-v b{font-size:32px;line-height:1;font-weight:800;letter-spacing:-.02em;color:#282834}
.ini-pg{display:block;height:6px;border-radius:99px;background:#f4f5f9;overflow:hidden}
.ini-pg i{display:block;height:6px;border-radius:99px;background:#d74009}
.ini-b{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap;background:#f4f5f9;color:#282834}
.ini-b.inf{background:#cef4ff;color:#002b5b}.ini-b.wa{background:#ffedc7;color:#942700}
.ini-card .pager-note{margin:0}
.exl{display:inline-flex;align-items:center;font-size:11px;font-weight:700;color:var(--warn-700);background:var(--warn-100);border-radius:99px;padding:3px 10px;white-space:nowrap}
.exl.real{color:var(--ok-700);background:var(--ok-100)}
.dk .exl,.dc .exl{margin-top:8px}
.dsub{display:block;margin-top:2px;font-size:12px;color:var(--g-700)}
.dsub+.exl{margin-top:6px}
.dsh{background:none;border:0;padding:0;gap:24px}
.dsh h2{font-size:24px;letter-spacing:-.02em}
.dfil,.dk,.dc{border-color:#e7e9f3;border-radius:12px;box-shadow:var(--sh)}
.dfil{padding:16px 20px}
.dc{padding:24px}
.dk{padding:22px 24px}
.dk>div{min-width:0}
.leg .nd b{color:var(--g-700);font-weight:600}
.leg .nd i{background:var(--g-300)}
.cq-h{margin:6px calc(-1*var(--cp)) 0;padding-inline:calc(var(--cp) + 18px)}
.rws .rw,.nores{border-color:#e7e9f3}
.mem{background:var(--g-050)}
@media (max-width:640px){
 .board>.app{--cp:16px}
 .page{padding:16px 16px 32px;gap:16px}
 .ph{padding:18px 16px}
 .ini-dl>div{padding:16px}
 .dsh .dkp{grid-template-columns:minmax(0,1fr)}
 .exl{white-space:normal}
}
/* ---------- Sin desborde de la página: las cajas anchas hacen scroll por dentro ---------- */
.sc{position:relative;max-width:100%;min-width:0}
.sc>.scr{overflow-x:auto;max-width:100%}
.sc>.scr:focus-visible{outline:2px solid var(--n-700);outline-offset:-2px}
@media (min-width:1101px){.sc::before,.sc::after{display:none}}
.sc::before,.sc::after{content:"";position:absolute;top:0;bottom:0;width:22px;z-index:2;pointer-events:none;opacity:0;transition:opacity .15s}
.sc::before{left:0;background:linear-gradient(to right,rgba(40,40,52,.2),rgba(40,40,52,0))}
.sc::after{right:0;background:linear-gradient(to left,rgba(40,40,52,.2),rgba(40,40,52,0))}
.sc.sl::before,.sc.sr::after{opacity:1}
.cq-h+.rws{margin-top:0}
.page>*,.dsh>*,.dc{min-width:0}
@media (max-width:640px){
 .hsi{min-width:1212px}.hsi.nc{min-width:810px}
 .scr>.tbl{min-width:760px}
 .seg{flex-wrap:wrap;border-radius:20px;max-width:100%}
 .sel{max-width:100%;min-width:0}.sel select{min-width:0;max-width:100%}
 .kpi .mini{min-width:140px}
 .hdr-a{position:relative}
 .hdr-a .menuwrap,.fwrap,.dfil .gm{position:static}
 .toolbar{position:relative}
 .menu,.fpanel,.gmenu{left:0;right:0;width:auto;max-width:100%}
 .menu{top:calc(100% + 6px)}.fpanel{top:calc(100% + 6px)}
 .dsh h2{font-size:22px}
 .dtop small{text-align:left}
 .dfil{flex-wrap:wrap}.dfil .df{flex:1 1 150px}.dfil .sp{display:none}
 .dkp{grid-template-columns:repeat(2,minmax(0,1fr))}.dkp.g2,.dcr.c3{grid-template-columns:minmax(0,1fr)}
 .dk{padding:14px;flex-wrap:wrap}.dk b{font-size:26px}
 .dc{padding:18px 16px}.dc .vb{position:static;margin-top:10px}
 .gbar{grid-template-columns:70px minmax(0,1fr) 64px}
 .leg{min-width:0}
}
</style>

<script>
(function(){
var DATA=window.INSCNUM_DATA,CON=window.INSCNUM_CONSOLIDADO,PG=10,PG5=25;

/* ---------- datos reales: reglas (cupos) y consolidado (combinaciones, filas) ---------- */
function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.')}
function fdate(s){var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
var SEXL={Hombres:'Hombre',Mujeres:'Mujer',Mixto:'Mixto'},SEXK=['Hombres','Mujeres','Mixto'];
var RB={};DATA.reglas.forEach(function(r){RB[r.id]=r});
var MAPA={};DATA.mapaNombres.forEach(function(m){MAPA[m.deporte+'|'+m.modalidad]=m});
// Si una combinación agrupa varias reglas con cupos distintos se muestra el rango.
function pick(rs,f,k){var v=[];rs.forEach(function(r){var x=r[f][k];if(x!=null&&v.indexOf(x)<0)v.push(x)});if(!v.length)return null;if(v.length===1)return v[0];v.sort(function(a,b){return a-b});return v[0]+'–'+v[v.length-1]}
var LC=window.INSCNUM_LC||{};
// D19: el límite conjunto H+M sale de shared/limites-conjuntos.js (el mismo que parametriza el Admin); null = sin definir.
function rango(v){v=v.filter(function(x,i){return v.indexOf(x)===i}).sort(function(a,b){return a-b});return v.length>1?v[0]+'–'+v[v.length-1]:v[0]}
function conjV(rs){var l=rs.filter(function(r){return LC[r.id]});
 return l.length?{a:rango(l.map(function(r){return LC[r.id].a})),s:rango(l.map(function(r){return LC[r.id].s}).filter(function(x){return x!=null}))}:{a:null,s:null}}
function suma(x,y){return x==null&&y==null?null:(x||0)+(y||0)}
// Ecuestre conserva su cupo mixto propio (no es límite conjunto): se deriva de la hoja como antes.
function ecu(rs){var l=rs.map(function(r){var t=r.mixtaComposicion||'',a=suma(r.masc.atletas,r.fem.atletas),x=/(\d+)\s*suplentes?/.exec(t),s=x?+x[1]:suma(r.masc.suplentes,r.fem.suplentes);return a==null?null:{a:a,s:s||0}}).filter(Boolean);
 if(!l.length)return null;var a=rango(l.map(function(x){return x.a})),s=rango(l.map(function(x){return x.s}));return a+(s?' + '+s+' suplentes':'')}
function tieneLC(rs){return rs.some(function(r){return r.id in LC})}
function jtxt(j){return !j?null:(j.a==null?'Sin tope':j.a+(j.s!=null&&j.s!==0?' + '+j.s+' sup.':''))}
function cupos(c){
 var m=MAPA[c.deporte+'|'+c.modalidad],ids=m?(m.reglaIds&&m.reglaIds.length?m.reglaIds:[m.reglaId]):[];
 var rs=ids.map(function(i){return RB[i]}).filter(Boolean);
 var cp={mc:pick(rs,'masc','atletas'),ms:pick(rs,'masc','suplentes'),fc:pick(rs,'fem','atletas'),fs:pick(rs,'fem','suplentes'),mx:null,cj:null,ov:false};
 // La HU fija Ajedrez en 5 y 1 para ambos géneros; la hoja solo trae FEM (MASC en blanco).
 if(c.deporte==='Ajedrez'&&cp.mc==null&&cp.fc!=null){cp.mc=cp.fc;cp.ms=cp.fs;cp.ov=true}
 // Ecuestre es el único con cupo mixto; el resto declara H y M contra el límite conjunto.
 if(c.deporte==='Ecuestre'){var e=ecu(rs);cp.mx=e}
 else if(tieneLC(rs))cp.cj=conjV(rs);
 return cp}
var COMB=CON.combinaciones.slice().sort(function(a,b){return a.deporte.localeCompare(b.deporte,'es')||a.modalidad.localeCompare(b.modalidad,'es')});
var KEY={};COMB.forEach(function(c,i){c.i=i;c.cp=cupos(c);KEY[c.deporte+'|'+c.modalidad]=c});
var DEPS=[];COMB.forEach(function(c){if(DEPS.indexOf(c.deporte)<0)DEPS.push(c.deporte)});
var DELN=CON.delegaciones,FILAS=CON.filas,HAB=CON.habilitadasPreventivas||[],ESTH=CON.estadoHabilitada;
function isHab(i){return HAB.indexOf(i)>-1}
// Región de cada delegación: tabla documentada en datos-consolidado.js (D6, 9-oct-2026).
var REGL=(CON.regiones||{lista:[]}).lista,REGD=(CON.regiones||{porDelegacion:[]}).porDelegacion;
var PROF=DELN.map(function(){return {deps:{},nm:0,nd:0}});
FILAS.forEach(function(r){var p=PROF[r[0]],d=p.deps[r[1]];if(!d){d=p.deps[r[1]]={};p.nd++}var m=d[r[2]];if(!m){m=d[r[2]]={};p.nm++}m[r[3]]=1});
var NCON=PROF.filter(function(p){return p.nd>0}).length;
// El total sale de DELN: con intención = con filas declaradas; habilitadas = marca explícita del consolidado.
var DELTXT=NCON+' con intención + '+HAB.length+' habilitada'+(HAB.length>1?'s':'');
var RANK={Hombres:0,Mujeres:1,Mixto:2};
function byOrg(a,b){return a[0]-b[0]||KEY[a[1]+'|'+a[2]].i-KEY[b[1]+'|'+b[2]].i||RANK[a[3]]-RANK[b[3]]}
function bySp(a,b){return KEY[a[1]+'|'+a[2]].i-KEY[b[1]+'|'+b[2]].i||a[0]-b[0]||RANK[a[3]]-RANK[b[3]]}
var ALL=FILAS.slice().sort(byOrg);
var COLS=['Delegación','Deporte','Modalidad','Sexo','Cupos Masculinos','Suplentes Masculinos','Cupos Femeninos','Suplentes Femeninos','Cupos Mixtos','Fecha de registro','Rol registrador','Correo electrónico'];
var ROLR=/gestor/i.test(CON.rol)?'Gestor':'Auxiliar';
function rowCells(f){var c=KEY[f[1]+'|'+f[2]],cp=c.cp,s=f[3];
 return [DELN[f[0]],f[1],f[2],SEXL[s],s==='Hombres'?cp.mc:null,s==='Hombres'?cp.ms:null,s==='Mujeres'?cp.fc:null,s==='Mujeres'?cp.fs:null,s==='Mixto'?cp.mx:null,fdate(f[4]),ROLR,CON.correos[f[0]]]}
function csvCell(v){v=v==null?'':String(v);return /[;"\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
// BOM + «;» para que Excel en configuración regional española abra las 12 columnas separadas.
function z2(n){return (n<10?'0':'')+n}
function membrete(t,al){var d=new Date();return ['XXIII Juegos Deportivos Nacionales','Córdoba – Sucre 2027',t].concat(al?[al]:[],['Informe generado el '+z2(d.getDate())+'-'+z2(d.getMonth()+1)+'-'+d.getFullYear()+' a las '+z2(d.getHours())+':'+z2(d.getMinutes()),''])}
function toCsv(rows,titulo,al){var o=membrete(titulo,al).map(csvCell).concat([COLS.map(csvCell).join(';')]);for(var i=0;i<rows.length;i++)o.push(rowCells(rows[i]).map(csvCell).join(';'));return '﻿'+o.join('\r\n')+'\r\n'}
function download(name,data,type){var b=new Blob([data],{type:type||'text/csv;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000)}
// SheetJS se carga la primera vez que se exporta; si falla, se cae al CSV con aviso.
var XURL='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',XP=null;
function loadXlsx(){if(window.XLSX)return Promise.resolve();if(XP)return XP;
 XP=new Promise(function(ok,ko){var s=document.createElement('script');s.src=XURL;s.onload=function(){window.XLSX?ok():ko()};s.onerror=ko;document.head.appendChild(s)}).catch(function(e){XP=null;throw e});return XP}
function xlsxBytes(rows,titulo,al){var X=window.XLSX,wb=X.utils.book_new(),
 m=X.utils.aoa_to_sheet(membrete(titulo,al).map(function(x){return [x]})),d=X.utils.aoa_to_sheet([COLS].concat(rows.map(rowCells)));
 m['!cols']=[{wch:70}];d['!cols']=[46,22,24,10,10,12,10,12,16,16,14,40].map(function(w){return {wch:w}});
 X.utils.book_append_sheet(wb,m,'Membrete');X.utils.book_append_sheet(wb,d,'Consolidado');
 return X.write(wb,{bookType:'xlsx',type:'array'})}
function exportar(rows,titulo,base,al,fin){
 loadXlsx().then(function(){download(base+'.xlsx',xlsxBytes(rows,titulo,al),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');fin(base+'.xlsx')})
 .catch(function(){download(base+'.csv',toCsv(rows,titulo,al));toast('No se pudo cargar el generador de Excel: se descargó un CSV con las mismas columnas.');fin(base+'.csv')})}

/* ---------- utilidades ---------- */
var GRUPOS=['Deportistas','Personal de Apoyo','Prensa','Voluntarios','Autoridades de Juzgamiento (Federaciones)','Comités Organizadores','Proveedores','Otros'];
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function opts(list,sel,all){return '<option value="">'+all+'</option>'+list.map(function(x){return '<option'+(x===sel?' selected':'')+'>'+esc(x)+'</option>'}).join('')}
function optsI(list,sel,all){return '<option value="">'+all+'</option>'+list.map(function(x,i){return '<option value="'+i+'"'+(String(i)===String(sel)?' selected':'')+'>'+esc(x)+'</option>'}).join('')}
var ICO_DL='<svg viewBox="0 0 20 20"><path d="M10 3v10M6 9.5l4 4 4-4M3.5 16.5h13"/></svg>';
var ICO_FL='<svg viewBox="0 0 20 20"><path d="M3 5h14M6 10h8M9 15h2"/></svg>';
var CHV='<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 8l5 5 5-5"/></svg>';
/* Un solo encabezado para las seis pantallas: contexto, título con acciones y, si aplica, pestañas o «volver». */
function HEAD(o){
 var ev='XXIII Juegos Deportivos Nacionales · Inscripción numérica',tab=!!o.tab;
 return '<header class="ph">'+(o.back?'<a class="back" href="#c1" data-go="c1">‹ Volver al consolidado</a>':'')+
 '<div class="ph-card"><div>'+(tab?'':'<p class="ph-ctx">'+ev+'</p>')+'<h1>'+(tab?ev:o.t)+'</h1></div>'+(o.a?'<div class="hdr-a">'+o.a+'</div>':'')+'</div>'+(tab?'':'<p class="ph-lead">'+o.s+'</p>')+'</header>'+
 (tab?TABS(o.tab)+'<p class="ph-lead ph-air">'+o.s+'</p>':'')}
function GO(id){return ' data-go="'+id+'"'}
/* Card con título, subtítulo y acciones; KPIS arma el resumen de arriba, como el N1 del delegado. */
function CARD(t,body,o){o=o||{};var hd='<div class="cd-h"><div><h2 class="ini-k">'+t+'</h2>'+(o.s?'<p class="cd-s">'+o.s+'</p>':'')+'</div>'+(o.a||'')+'</div>';if(o.out)return '<div class="cd-out">'+hd+'</div><section class="ini-card ini-nb"'+(o.t?' data-t="'+o.t+'"':'')+'>'+body+'</section>';return '<section class="ini-card"'+(o.t?' data-t="'+o.t+'"':'')+'><div class="cd-h"><div><h2 class="ini-k">'+t+'</h2>'+(o.s?'<p class="cd-s">'+o.s+'</p>':'')+'</div>'+(o.a||'')+'</div>'+body+'</section>'}
function KPIS(t,l){return '<div class="kpis" role="group" aria-label="'+t+'">'+l.map(function(k){return '<section class="ini-card kpi1"><dl class="ini-dl"><div><dt>'+k[0]+'</dt><dd><span class="ini-v"><b>'+k[1]+'</b>'+(k[2]||'')+'</span>'+(k[3]!=null?'<span class="ini-pg"><i style="width:'+k[3]+'%"></i></span>':'')+'</dd></div></dl></section>'}).join('')+'</div>'}
function EX(){return '<span class="exl">Cifras de ejemplo (Intercolegiados)</span>'}
/* Pestañas que agrupan las vistas del seguimiento (consolidado, cupo, avance, tablero). */
function TABS(cur){return '<div class="ptabs" role="tablist" aria-label="Vistas del seguimiento">'+[['c1','Consolidado'],['c2','Declarado vs cupo'],['c3','Quién falta'],['c6','Tablero']].map(function(t){return '<button type="button" role="tab" class="ptab'+(t[0]===cur?' on':'')+'" aria-selected="'+(t[0]===cur)+'" tabindex="'+(t[0]===cur?0:-1)+'"'+(t[0]===cur?'':' data-go="'+t[0]+'"')+'>'+t[1]+'</button>'}).join('')+'</div>'}
function num(c){return typeof c==='number'?c:parseInt(String(c).split('–').pop(),10)}
