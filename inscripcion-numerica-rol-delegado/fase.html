<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fase de inscripción numérica, rol delegado</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Una pantalla a la vez a todo el ancho; el sidebar lo pone el shell. */
:root{--panel:#fff;--fg:#1f2330;--muted:#5d6272;--line:#dcdbd5;--accent:#d74009;--font:'Inter',-apple-system,system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;color-scheme:light}
*{box-sizing:border-box}
html,body{background:#fff}
body{color:var(--fg);font-family:var(--font);margin:0;line-height:1.5}
[hidden]{display:none!important}
.scr:not(.cur){display:none}
.stage{background:#fff}
.stage>.app{min-height:100vh;display:flex;flex-direction:column}
/* Con pocos deportes la página crece y la barra de totales queda al fondo. */
.stage>.app>.page{flex:1 0 auto}

/* ---------- Artboard: la app, siempre clara ---------- */
.app{
  --n-050:#fff3e6;--n-100:#ffedc7;--n-500:#ff7b24;--n-600:#f05705;--n-700:#d74009;--n-900:#942700;
  --g-050:#fafbff;--g-100:#f4f5f9;--g-200:#e8e9f2;--g-300:#d4d5e4;--g-500:#9c9ebf;--g-600:#8788ab;--g-700:#646587;--g-900:#282834;
  --ok-100:#defade;--ok-700:#1f8923;--info-100:#cef4ff;--info-700:#0a55a8;--warn-100:#fef3c7;--warn-700:#b45309;--err-100:#ffe5e9;--err-700:#da1630;
  background:#fff;color:var(--g-900);font-family:'Inter',-apple-system,sans-serif;font-size:14px;position:relative;color-scheme:light
}
.app *{font-family:inherit}
.nav{display:flex;align-items:center;gap:12px;padding:24px 16px 0}
.crumb{display:flex;align-items:center;flex-wrap:wrap;gap:2px 10px;min-width:0;font-weight:500;font-size:14px}
.crumb svg{width:12px;height:12px;stroke:var(--g-900);fill:none;stroke-width:2}
.page{padding:32px 16px 40px;display:flex;flex-direction:column;gap:20px}
.card{border:1px solid var(--g-200);border-radius:20px;background:#fff;padding:32px}
.search{display:flex;align-items:center;gap:10px;border:1px solid var(--g-700);border-radius:99px;height:42px;padding:0 16px;min-width:230px;color:var(--g-700);font-size:13px}
.search svg{width:18px;height:18px;stroke:var(--g-900);fill:none;stroke-width:1.8}
.hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;flex-wrap:wrap}
.hdr h1{font-size:30px;font-weight:700;margin:0 0 6px;letter-spacing:-.01em;max-width:720px}
.hdr p{margin:0;color:var(--g-700);font-size:16px}
.unsaved{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--warn-700);background:var(--warn-100);border-radius:99px;padding:6px 12px;align-self:center}
.unsaved i{width:8px;height:8px;border-radius:50%;background:var(--warn-700)}
.btn{border-radius:99px;height:50px;padding:0 26px;font-size:16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;white-space:nowrap}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.btn.pri{background:var(--n-700);color:#fff}.btn.pri:hover{background:var(--n-900)}
.btn.sec{background:#fff;color:var(--n-700);border-color:var(--g-300)}
.btn.ter{background:none;color:var(--n-700);padding:0 12px;height:36px;font-size:15px}
.btn.sm{height:40px;font-size:14px;padding:0 20px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.list{border:1px solid var(--g-200);border-radius:16px;overflow:hidden}
.list-h{display:flex;align-items:center;gap:28px;padding:16px 20px;border-bottom:1px solid var(--g-200);font-size:16px}
.sport{border-bottom:1px solid var(--g-200)}.sport:last-child{border-bottom:0}
.sport-r{display:flex;align-items:center;gap:16px;padding:16px 22px;cursor:pointer}
.sport.open>.sport-r{background:#e9eaf0}
.sport-ico{width:42px;height:42px;border-radius:50%;background:var(--g-100);display:grid;place-items:center;flex:none;color:var(--g-700);font-size:13px;font-weight:600}
.sport-t{flex:1;min-width:0}.sport-t b{display:block;font-size:18px;font-weight:600}.sport-t small{color:var(--g-700);font-size:14px}
.sport-c{color:var(--g-700);font-size:16px}
/* Avance y estado de cada deporte juntos, como un solo botón. */
.sport-sum{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--g-300);border-radius:99px;padding:4px 6px 4px 14px;background:#fff}
.sport-sum:not(:has(.st)){padding-right:14px}
.sport-sum .sport-c{font-size:14px}.sport-sum .st{min-width:0;padding:4px 12px}.sport-sum .st.none{background:var(--g-100)}
.sport-r:hover .sport-sum{border-color:var(--g-500)}
.st{font-size:12px;font-weight:600;border-radius:99px;padding:3px 10px;min-width:92px;text-align:center;color:var(--g-900)}
.st.none{background:transparent}.st.part{background:var(--warn-100);color:var(--warn-700)}.st.full{background:var(--ok-100);color:var(--ok-700)}
.chev{width:20px;height:20px;stroke:var(--g-900);fill:none;stroke-width:2;transition:transform .15s}
.sport.open .chev{transform:rotate(90deg)}
.pruebas{display:none;background:#fafafa;padding:18px 22px 26px 58px}
.sport.open .pruebas{display:block}
.closed-n{border:1px solid #f2d27a;background:var(--warn-100);color:#6b3c06;border-radius:12px;padding:14px 18px;display:flex;flex-direction:column;gap:2px}
.closed-n b{font-weight:700}
.errs{border:1px solid #f4b7c0;background:var(--err-100);border-radius:12px;padding:14px 18px;color:#7d0b1d}
.errs b{display:block;margin-bottom:6px}.errs ul{margin:0;padding-left:20px}
.modal-bg{position:fixed;z-index:60;inset:0;background:rgba(40,40,52,.45);display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:#fff;border-radius:20px;padding:28px;width:480px;max-width:100%;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.modal h3{margin:0 0 6px;font-size:22px;font-weight:700}.modal p{margin:0 0 18px;color:var(--g-700);font-size:15px}
.modal .foot{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.toast{position:fixed;z-index:70;right:24px;top:72px;background:#fff;border:1px solid var(--g-200);border-left:5px solid #28bf2d;border-radius:12px;padding:14px 18px;box-shadow:0 10px 30px rgba(0,0,0,.14);min-width:300px}
.toast.err{border-left-color:var(--err-700)}.toast b{display:block;font-size:15px}.toast span{font-size:13px;color:var(--g-700)}
.empty{text-align:center;padding:60px 20px;color:var(--g-700)}
.empty b{display:block;font-size:20px;color:var(--g-900);margin-bottom:6px}

/* ---------- Marco ---------- */
.vs{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:99px;background:var(--panel)}
.vs button{font:inherit;font-size:12.5px;font-weight:500;color:var(--muted);background:none;border:2px solid transparent;border-radius:99px;padding:3px 14px;cursor:pointer}
.vs button[aria-pressed="true"]{color:var(--fg);border-color:var(--accent)}
.vs button:disabled{cursor:not-allowed;opacity:.55}
.vs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vs-l{font-size:12px;color:var(--muted);margin-left:6px}

/* ---------- Artboard: la fase ---------- */
.app .hdr .unsaved{margin-left:auto}
.chip-ok{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ok-700);background:var(--ok-100);border-radius:99px;padding:6px 12px}
.chip-gr{display:inline-flex;font-size:12px;font-weight:600;color:var(--g-700);background:var(--g-100);border-radius:99px;padding:5px 12px}
.gr{display:grid;grid-template-columns:minmax(190px,1.5fr) repeat(5,minmax(128px,1fr));gap:8px 10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--g-200)}
.pruebas.g.c4 .gr{grid-template-columns:minmax(190px,1.5fr) repeat(4,minmax(128px,1fr))}
.gr:last-child{border-bottom:0}
/* Columnas con el color de su género (H azul, M rosa, mixto violeta), cebra y hover de fila. */
.pruebas.g .gr{column-gap:0;padding:0;align-items:stretch;border-bottom:0}
.pruebas.g{padding:12px 16px 16px 22px}
.pruebas.g .gr>*{padding:6px 8px}
.pruebas.g .gr>:nth-child(n+2){text-align:center}
.pruebas.g .gr:not(.gh)>.mlab{padding-block:16px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
/* Celdas de 120 px (crecen solo si el texto de la modalidad no cabe); el aviso de tope no agranda la fila. */
.pruebas.g .gr:not(.gh){grid-template-rows:minmax(120px,auto)}
.pruebas.g .gr:not(.gh)>.cell{display:flex;flex-direction:column;align-items:center;justify-content:center}
.pruebas.g .cell.off .na,.pruebas.g .cell .ns{padding:0}
.gnote{margin:12px 0 0;padding:10px 14px;border-radius:10px;background:var(--g-100);color:var(--g-700);font-size:13px;line-height:1.5}.gnote b{color:var(--g-900);font-weight:600}
.pruebas.g .gr:not(.gh)>.cell:not(.off):nth-child(n+2):nth-child(-n+3){background:rgba(31,120,209,.07)}
.pruebas.g .gr:not(.gh)>.cell:not(.off):nth-child(n+4):nth-child(-n+5){background:rgba(163,24,95,.06)}
.pruebas.g .gr:not(.gh)>.cell:not(.off):nth-child(6){background:rgba(91,42,166,.07)}
.pruebas.g .gr.gh>*{padding:6px 8px;font-size:14px}
.pruebas.g .gr.gh>:nth-child(n+2):nth-child(-n+3){background:rgba(31,120,209,.15);color:var(--info-700)}
.pruebas.g .gr.gh>:nth-child(n+4):nth-child(-n+5){background:rgba(163,24,95,.13);color:#a3185f}
.pruebas.g .gr.gh>:nth-child(6){background:rgba(91,42,166,.15);color:#5b2aa6}
.pruebas.g .gr:not(.gh):nth-child(odd){background:rgba(40,40,52,.04)}
.pruebas.g .gr:not(.gh):hover{background:rgba(215,64,9,.08)}
/* Donde termina un género, el divisor se marca más fuerte. */
.pruebas.g .gr.gend{border-bottom:2px solid var(--g-600)}
.gr.gh{font-size:12px;font-weight:600;color:var(--g-700);padding:2px 0 8px;border-bottom:1px solid var(--g-300)}
.mlab b{display:block;font-size:15px;font-weight:500;padding-top:6px}
.mlab small{display:block;color:var(--g-700);font-size:12px}
.cell small{display:block;color:var(--g-700);font-size:12px;margin-top:3px}
.cell .caphit{display:block;color:var(--info-700);font-size:12px;font-weight:600;margin-top:2px}
.cell.off .na{display:block;color:var(--g-500);padding-top:8px}
.cell.ro b{display:block;font-size:24px;padding-top:0}
.cell.ro small{font-size:16px}
.stp{display:inline-flex;align-items:center;border:1px solid var(--g-300);border-radius:10px;overflow:hidden;background:#fff}
.stp button{width:30px;height:36px;border:0;background:var(--g-100);color:var(--g-900);font-size:17px;cursor:pointer;line-height:1}
.stp button:hover{background:var(--g-200)}
.stp input{width:48px;height:36px;border:0;text-align:center;font-size:15px;font-weight:600;color:var(--g-900);background:#fff;outline:0}
.stp:focus-within{border-color:var(--n-700)}
.cell.err .stp{border-color:var(--err-700);background:var(--err-100);box-shadow:0 0 0 1px var(--err-700)}
.cell.err .stp input{background:var(--err-100);color:var(--err-700)}
.cell.warn .stp{border-color:#e0a030;background:var(--warn-100)}
.cell.warn .stp input{background:var(--warn-100)}
.rowmsg{grid-column:1/-1;display:grid;gap:3px}
.msg{font-size:13px;font-weight:500;padding-left:6px}
.msg.err{color:var(--err-700)}.msg.warn{color:var(--warn-700)}
.tbar{position:sticky;bottom:0;z-index:4;background:#fff;border-top:1px solid var(--g-300);box-shadow:0 -6px 18px rgba(0,0,0,.08);padding:24px 21px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.tbar .own{font-weight:700;font-size:15px;padding-left:2px}
.tbar .tot{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;min-width:72px}
.tbar .tot b{font-size:22px;line-height:1.1;font-weight:700}
.tbar .tot small{font-size:11px;line-height:1.2;color:var(--g-700)}
.tbar .sp{flex:1}
.rolchip{font-size:12px;font-weight:600;color:var(--n-900);background:var(--n-050);border-radius:99px;padding:4px 10px}
.hintx{font-size:12px;color:var(--g-700)}
.caps{border:1px solid var(--g-200);border-radius:14px;background:#fff;padding:0 18px}
.caps h4{margin:0;font-size:15px;font-weight:700;position:relative}
.caps-h{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 28px 12px 0;position:relative;cursor:pointer;font-size:15px;font-weight:700;color:var(--g-900)}
.caps-h:focus-visible{outline:2px solid var(--n-700);outline-offset:2px;border-radius:8px}
.caps-h .cn{font-weight:500;color:var(--g-700)}
.caps-h .cx,.caps-h .cw{font-size:12px;font-weight:600;border-radius:99px;padding:3px 10px}
.caps-h .cx{color:var(--info-700);background:var(--info-100)}.caps-h .cw{color:var(--warn-700);background:var(--warn-100)}
.caps-h svg{position:absolute;right:0;top:50%;margin-top:-8px;width:16px;height:16px;transform:rotate(90deg);transition:transform .15s}
.caps.open .caps-h svg{transform:rotate(-90deg)}
.caps .cps{padding:0 0 12px;border-top:1px solid var(--g-200);padding-top:8px}
.caps-h .cb{font-size:12px;font-weight:600;border-radius:99px;padding:3px 10px;color:#fff;background:var(--err-700)}
.caps{scroll-margin-top:72px}
.caps .cpb{border-top:1px solid var(--g-200);padding:12px 0}
.caps .cpb .cps{border-top:0;padding-top:0}
.caps .cpb h5{margin:0 0 6px;font-size:13px;font-weight:700;color:var(--g-900)}
.errs-s{border:1px solid #f4b7c0;background:var(--err-100);border-radius:10px;padding:12px 14px;color:#7d0b1d;margin-bottom:14px}
.errs-s:focus{outline:2px solid var(--err-700);outline-offset:2px}
.errs-s h5{color:#7d0b1d!important}
.errs-s ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.errs-s li{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13.5px}
.errs-s li>span{flex:1 1 260px;min-width:0}
.errs-s .goto{all:unset;box-sizing:border-box;cursor:pointer;font-size:13px;font-weight:600;color:var(--err-700);text-decoration:underline;white-space:nowrap;padding:2px 4px;border-radius:4px}
.errs-s .goto:focus-visible{outline:2px solid var(--err-700);outline-offset:1px}
.sport-r:focus-visible{outline:2px solid var(--n-700);outline-offset:-2px}
.cp{display:grid;grid-template-columns:230px minmax(0,1fr) 70px;gap:14px;align-items:center;padding:5px 0;position:relative}
.cp small{color:var(--g-700);font-size:12px;margin-left:6px}
.cp .trk{height:10px;border-radius:99px;background:var(--g-200);overflow:hidden}
.cp .trk i{display:block;height:100%;background:var(--ok-700)}
.cp.lim .trk i{background:var(--info-700)}
.cp .cpl{display:block;font-size:12px;font-weight:600;color:var(--info-700);margin-left:6px}
.cp .v{text-align:right;font-size:14px}
.smt{width:100%;border-collapse:collapse;font-size:14px;margin:4px 0 6px}
.smt th{text-align:right;font-size:12px;color:var(--g-700);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--g-300)}
.smt th:first-child,.smt td:first-child{text-align:left}
.smt td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--g-200)}
.smt tr.t td{font-weight:700;border-bottom:0;background:var(--g-100)}
.modal.w{width:660px}
.modal .chiprow{margin:0 0 12px}
.docbg{background:var(--g-200);padding:28px 20px;min-height:300px}
.emp{text-align:center;padding:34px 18px}
.emp b{display:block;font-size:18px;margin:10px 0 6px}
.emp p{margin:0 0 16px;color:var(--g-700);font-size:14px}
.emp .ic{width:52px;height:52px;border-radius:50%;background:var(--g-100);display:grid;place-items:center;margin:0 auto;font-size:22px}

/* ---------- Prototipo ---------- */
.cr-l{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer}
.cr-l:hover{color:var(--n-700);text-decoration:underline}
.fl{position:fixed;top:56px;right:16px;z-index:7000;display:none}
body.sim-on .fl{display:flex}
body:not(.en-shell) .fl{top:auto;right:auto;left:16px;bottom:44px}
.fl .vs{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.sim-p{display:flex;width:max-content;max-width:calc(100vw - 32px);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.14);flex-direction:column;gap:8px}
.sim-d{position:fixed;left:16px;bottom:12px;z-index:7000;font-size:12.5px;color:var(--muted)}
.sim-d summary{cursor:pointer;padding:4px 10px;border:1px dashed var(--line);border-radius:99px;background:var(--panel);list-style:none;width:max-content}
.sim-d summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body.en-shell .sim-d{display:none}
.sim-g{display:flex;align-items:center;gap:8px;justify-content:space-between}
.sim-g .vs-l{margin:0}
.cert-bg{align-items:flex-start;overflow:auto;padding:0;z-index:7500}
.cert-pan{width:100%;min-height:100%;background:#fff}
.cert-top{display:flex;align-items:center;justify-content:space-between;padding:12px 21px;border-bottom:1px solid var(--g-200);font-weight:600;color:var(--g-900)}

/* ---------- Grilla por declaración, motor y certificado ---------- */
.gtag svg{width:14px;height:14px;margin-right:4px;vertical-align:-2px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.gtag{display:inline-block;font-size:14px;font-weight:600;border-radius:99px;padding:2px 9px;margin-top:3px;background:var(--g-100);color:var(--g-700)}
.gtag.gH{background:#e4efff;color:var(--info-700)}.gtag.gM{background:#fde7f1;color:#a3185f}.gtag.gX{background:#efe7ff;color:#5b2aa6}
.mlab b{padding-top:2px}
.gr.dis{opacity:.62}
.rn{grid-column:1/-1;font-size:12.5px;color:var(--g-700);padding-left:6px}
.pc{font-style:normal;font-size:10.5px;font-weight:700;color:var(--info-700);background:var(--info-100);border-radius:99px;padding:1px 7px;margin-left:6px;white-space:nowrap}
.pc.mx{color:var(--ok-700);background:var(--ok-100)}
.cp.av .v{color:var(--info-700);font-weight:600}.cp.av .trk{visibility:hidden}.avn{grid-column:1/-1;font-size:12px;color:var(--g-700);margin:-2px 0 6px}
.inh:hover,.inh:focus-visible{opacity:1!important}
.inh{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--g-600);color:#fff;opacity:.5;font:700 10px/1 var(--font);margin-left:5px;cursor:help;vertical-align:middle}
.fbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.fbar .search{width:380px}
.search input{border:0;outline:0;background:transparent;flex:1;font-size:14px;color:var(--g-900);min-width:0}
.fchips{display:flex;gap:8px;flex-wrap:wrap}
.fch{font:inherit;font-size:14px;font-weight:500;border:1px solid var(--g-300);background:#fff;color:var(--g-700);border-radius:99px;padding:8px 16px;cursor:pointer}
.fch[aria-pressed="true"]{border-color:var(--n-700);color:var(--g-900);background:var(--n-050)}
.caps .cps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:32px}
.caps .cp{grid-template-columns:minmax(150px,215px) minmax(40px,1fr) 80px}
.caps .cp small{display:block;margin:0}
.caps .cp .pc{margin:2px 0 0;display:inline-block}
@media(max-width:1100px){.caps .cps{grid-template-columns:minmax(0,1fr)}}
@media(max-width:640px){.caps{padding:0 12px}.caps .cp{grid-template-columns:minmax(0,1fr) 72px;row-gap:4px}.caps .cp>span:first-child{grid-column:1/-1}.caps .cp .trk{grid-column:1}.caps .cp .v{grid-column:2;white-space:nowrap}}
/* Tres columnas: organización y rol a la izquierda, totales y revisión al centro, acciones a la derecha. */

var MJ_EXC={Ecuestre:1};

 for(var i=0;i<rs.length;i++){var r=rs[i].reglaId&&RL[rs[i].reglaId];if(r)return r}

 var m=mixCap(r);

var ROWS=(function(){

  var rs=G[k],r=grpRule(rs),mx=rs.filter(function(a){return a.sexo==='Mixto'})[0],aff=!!(r&&r.generos&&r.generos.X&&!MJ_EXC[rs[0].deporte]);

 });

 rows.forEach(function(r){if(!r.mj)return;var g=r.mj;if(r.sx==='H')g.hi=r.i;else g.mi=r.i});

function modComp(o){return o.confirmado!==false&&o.alcance==='modalidad'}

function tVale(t){return !!t&&t.alcance==='modalidad'&&t.atletas!=null&&!t.aviso}

var CRIT_OUT={'tenis-de-campo':1,atletismo:1,patinaje:1,triatlon:1,tejo:1,'tiro-deportivo':1};
